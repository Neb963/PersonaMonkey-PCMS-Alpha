name: Extension tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: "154.0.8037.57"
      - name: Confirm Chrome version
        run: ${{ steps.chrome.outputs.chrome-path }} --version
      - name: Run release gate
        run: npm run release:check
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persona-route-manager-extension
          path: |
            dist/*.xpi
            dist/*.sha256
            dist/*.personamonkey.zip
