name: alpha-firefox

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-firefox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  persona-monkey-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALPHA_EVENT: ${{ github.event_name }}
      ALPHA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ALPHA_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      GITHUB_TOKEN: ${{ github.token }}
      ALPHA_REPORT: .agent-runs/alpha-ci.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate the published claim using exact current-main authority
        shell: bash
        run: |
          git fetch origin main
          authority_dir="$RUNNER_TEMP/alpha-main-authority"
          mkdir -p "$authority_dir"
          git archive origin/main tools/alpha | tar -x -C "$authority_dir"
          node "$authority_dir/tools/alpha/ci.mjs" --root "$GITHUB_WORKSPACE"
      - name: Test pin integrity and typed broker faults plus preserved PersonaMonkey regressions
        run: |
          node --test tests/alpha/browser-baseline/*.test.mjs tests/firefox/*.test.mjs tests/pcms/p008-*.test.mjs tests/pcms/p009-*.test.mjs
          node extension/tests/persona-identity.test.mjs
          node extension/tests/management-integration.test.mjs
          node extension/tests/integration-lifecycle.test.mjs
          node extension/tests/integration-contract-parity.test.mjs
          node extension/tests/background-routing-init.test.mjs
      - name: Install Firefox runtime libraries if missing
        timeout-minutes: 6
        shell: bash
        run: |
          packages="libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6"
          if dpkg -s $packages >/dev/null 2>&1; then exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get $apt_opts update && sudo timeout 150 apt-get $apt_opts install -y $packages; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install and attest exact Alpha Firefox artifact
        id: install
        env:
          FIREFOX_INSTALL_ROOT: ${{ runner.temp }}/alpha-p101-firefox
        run: node tools/alpha/firefox/install-pinned.mjs
      - name: Verify isolated loopback smoke and blocked unlisted origin
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_INSTALL_MANIFEST: ${{ steps.install.outputs.alpha_install_manifest }}
          FIREFOX_SMOKE_DIR: ${{ runner.temp }}/alpha-p101-smoke
          FIREFOX_SMOKE_REPORT: ${{ runner.temp }}/alpha-p101-smoke-report.json
        run: node tools/alpha/firefox/smoke.mjs
      - name: Package twice, install once and verify PersonaMonkey across unload and restart
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_INSTALL_MANIFEST: ${{ steps.install.outputs.alpha_install_manifest }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/alpha-p101-packaged
          FIREFOX_PACKAGED_REPORT: ${{ runner.temp }}/alpha-p101-packaged-report.json
        run: node tests/alpha/browser-baseline/packaged.mjs
      - name: Reject a main change during the browser suite
        run: node tools/alpha/check-main.mjs
      - name: Upload only bounded non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-p101-firefox-evidence
          path: |
            .agent-runs/alpha-ci.json
            ${{ runner.temp }}/alpha-p101-smoke-report.json
            ${{ runner.temp }}/alpha-p101-packaged-report.json
          if-no-files-found: error
          retention-days: 7
